<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>叠茵庭搬屋 Checklist</title>
</head>
<body>
<header>
  <div class="headrow">
    <div>
      <h1>叠茵庭搬屋 Checklist</h1>
      <div class="sub">租住・6座 ｜ 8/23 安床＋象徵式入宅 ｜ 8/28 搬屋</div>
    </div>
    <button id="settingsBtn" class="iconbtn" aria-label="同步設定">⚙︎</button>
  </div>
  <div class="syncrow">
    <span id="syncBadge" class="sync local">● 本機模式</span>
    <span id="lastSync" class="lastsync"></span>
  </div>
</header>

<main class="wrap">
  <div class="progress">
    <div class="progressTop"><strong id="ptext">0 / 0 已完成</strong><span id="who"></span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

  <div class="ritualNote">
    <strong>8/23 安床重點</strong>
    <div>13:00–15:00 完成象徵式入宅＋安床。只需新床褥，未有床單／枕頭／被亦可以；當晚不用留宿。熱水用保溫壺由舊屋帶過去即可。</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-filter="all">全部</button>
    <button class="tab" data-filter="now">現在處理</button>
    <button class="tab" data-filter="ritual">8/23 安床入宅</button>
    <button class="tab" data-filter="move">8/28 搬屋</button>
    <button class="tab" data-filter="after">搬入後</button>
    <button class="tab" data-filter="optional">視乎需要</button>
  </div>

  <div id="list"></div>
  <button class="reset" id="reset">清除本機完成紀錄</button>
  <p class="privacy">長按每項左邊的 ☰ 可拖移排序；在「全部」畫面可跨分類拖移。如已啟用家人同步，分類位置及排序亦會同步。請勿在備註欄輸入身份證號碼、密碼、銀行資料等敏感資料。</p>
</main>

<dialog id="settingsDialog">
  <form method="dialog" class="dialogbox" id="settingsForm">
    <div class="dialogHead">
      <div><h2>家人即時同步</h2><p>Firebase Firestore 設定</p></div>
      <button class="closebtn" value="cancel" aria-label="關閉">×</button>
    </div>

    <label>你的名稱
      <input id="displayName" autocomplete="name" placeholder="例如：KL">
    </label>

    <label>家庭共用碼
      <div class="inline"><input id="familyCode" autocapitalize="characters" placeholder="12位英數字"><button type="button" id="generateCode">產生</button></div>
    </label>

    <label>Firebase Web App 設定
      <textarea id="firebaseConfig" rows="7" placeholder='貼上 Firebase 提供的 firebaseConfig，例如：\nconst firebaseConfig = {\n  apiKey: "...",\n  authDomain: "...",\n  projectId: "...",\n  appId: "..."\n};'></textarea>
    </label>

    <details>
      <summary>家人快速加入</summary>
      <p class="hint">設定完成後可複製「家庭設定碼」畀家人；家人只需貼入同一個 PWA。</p>
      <textarea id="familyPack" rows="3" placeholder="家庭設定碼會顯示在這裡"></textarea>
      <div class="btnrow">
        <button type="button" id="copyPack">複製家庭設定碼</button>
        <button type="button" id="importPack">匯入家庭設定碼</button>
      </div>
    </details>

    <div id="settingsMsg" class="msg"></div>
    <div class="btnrow end">
      <button type="button" id="disconnectBtn" class="secondary">只用本機</button>
      <button type="button" id="saveSettings" class="primary">儲存並連線</button>
    </div>
  </form>
</dialog>

<script type="module" src="app.js"></script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js')); }
</script>
</body>
</html>
